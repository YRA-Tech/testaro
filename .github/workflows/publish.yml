# Publishes the package to npm when a GitHub release is published (the release tag must equal
# v<package.json version>), or on manual dispatch. Authenticates by npm trusted publishing
# (OIDC): the testaro package on npmjs.com names this repository and workflow file as a trusted
# publisher, so no token is needed; the job must not configure any registry token, or the CLI
# skips the OIDC exchange. prepublishOnly regenerates the rule registry and the emitted
# TypeScript, and the version check refuses a release tag that does not match.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest && npm --version
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Verbose, so the log shows the trusted-publishing (OIDC) token exchange.
      - run: npm publish --provenance --access public --loglevel verbose
