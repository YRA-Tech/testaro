# Publishes the package to npm when a GitHub release is published (the release tag must equal
# v<package.json version>), or on manual dispatch. Authenticates by npm trusted publishing:
# the job's GitHub OIDC token (permissions.id-token: write) identifies this repository and
# workflow file to npm, which is configured on npmjs.com (package testaro, trusted publisher
# GitHub Actions, YRA-Tech/testaro, publish.yml) to accept publishes from it. No npm token is
# involved; a NODE_AUTH_TOKEN would take precedence over OIDC, so none is set.
# prepublishOnly regenerates the rule registry and the emitted TypeScript, and the version
# check refuses a release tag that does not match.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package version v$version" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm publish --provenance --access public
