name: Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    name: Lint the validation harness and check the fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Scoped to validation/ because the rest of the project still has lint debt that predates
      # the restoration of the ESLint configuration. Widen this as that debt is paid off.
      - name: Lint the validation harness
        run: npx eslint validation eslint.config.js
      # Runs no browser, so it is fast and deterministic: it catches a fixture that names a
      # nonexistent rule, a target whose file is absent or differs in case, and a malformed
      # expectation, none of which a browser-based validation reports clearly.
      - name: Check the validation fixtures
        run: npm run checkFixtures
