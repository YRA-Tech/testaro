<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Style sheets that Alfa's page reader reads in full</title>
    <style>
      body { background: #fff; }
      @media (min-width: 10px) { h1 { color: #000; } }
    </style>
  </head>
  <body>
    <main>
      <h1>No style losses</h1>
      <p>Alfa reads every rule of this page's sheet.</p>
    </main>
  </body>
</html>
