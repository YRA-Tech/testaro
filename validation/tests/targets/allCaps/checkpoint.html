<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Page whose upper-case text grows after an action</title>
    <meta name="description" content="tester">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <main>
      <h1>Page whose upper-case text grows after an action</h1>
      <p id="initial">These INITIAL CAPITALS are visible when the page loads.</p>
      <button type="button" onclick="document.getElementById('more').hidden = false">Show more</button>
      <section id="more" hidden>
        <p id="revealed">These REVEALED CAPITALS appear after the button is activated.</p>
      </section>
    </main>
  </body>
</html>
