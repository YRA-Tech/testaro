<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Page with a late change</title>
    <meta name="description" content="tester">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <main>
      <h1>Page with a late change</h1>
      <p>A banner appears 3 seconds after this page loads and then stays still.</p>
    </main>
    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          const banner = document.createElement('p');
          banner.textContent = 'This banner arrived late.';
          banner.style.cssText = 'background-color: #fc0; font-size: 3rem; padding: 2rem';
          document.querySelector('main').prepend(banner);
        }, 3000);
      });
    </script>
  </body>
</html>
