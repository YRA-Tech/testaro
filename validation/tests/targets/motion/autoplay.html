<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Page with instructions to play automatically</title>
    <meta name="description" content="tester">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>
    <main>
      <h1>Page with instructions to play automatically</h1>
      <p>The media on this page need not play in the test browser: the instructions suffice.</p>
      <h2>Violations</h2>
      <video id="autoVideo" src="missing.mp4" autoplay width="320" height="180"></video>
      <iframe id="autoYouTube" title="autoplaying player" width="560" height="315" src="https://www.youtube-nocookie.com/embed/aaaaaaaaaaa?autoplay=1&amp;mute=1"></iframe>
      <h2>Not violations</h2>
      <iframe title="player without autoplay" width="560" height="315" src="https://www.youtube-nocookie.com/embed/aaaaaaaaaaa"></iframe>
      <iframe title="player permitting autoplay" width="560" height="315" allow="autoplay" src="https://www.youtube-nocookie.com/embed/aaaaaaaaaaa?mute=1"></iframe>
      <div hidden>
        <video src="missing.mp4" autoplay muted width="320" height="180"></video>
      </div>
      <video src="missing.mp4" width="320" height="180"></video>
    </main>
  </body>
</html>
