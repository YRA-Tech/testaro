<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Page with a button with deviant styles</title>
    <meta name="description" content="tester">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      .btn {
        display: inline-block;
        font: normal 400 16px/1.5 sans-serif;
        color: rgb(0, 0, 0);
        background-color: rgb(220, 220, 220);
        border: 1px solid rgb(0, 0, 0);
        border-radius: 4px;
        padding: 4px 8px;
        min-width: 44px;
        min-height: 44px;
      }
      .deviant {
        color: rgb(255, 0, 0);
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page with a button with deviant styles</h1>
      <p>This paragraph contains 4 buttons. The third has a deviant color and border radius: <button class="btn" type="button">First</button> <input class="btn" type="submit" value="Second"> <button class="btn deviant" type="button">Third</button> <span class="btn" role="button" tabindex="0">Fourth</span>.</p>
    </main>
  </body>
</html>
