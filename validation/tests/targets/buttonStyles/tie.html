<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Page with 2 buttons with different styles</title>
    <meta name="description" content="tester">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      button {
        padding: 4px 8px;
      }
      .wide {
        padding: 4px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page with 2 buttons with different styles</h1>
      <p>This paragraph contains 2 buttons with different paddings, so neither padding is the most common: <button type="button">First</button> <button class="wide" type="button">Second</button>.</p>
    </main>
  </body>
</html>
